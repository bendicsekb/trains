openQuestions:
  - "Whether the extracted workflow improves outcomes, reduces rework, or reduces unsupported claims compared with the prior idea or an ordinary baseline."
  - "Whether support counts persist in held-out sessions or other task domains; the current ten are a selected development subset."
  - "Whether the workflow's added claim-boundary and failure-classification steps justify their time and coordination cost."
  - "Whether reviewers can apply the abstract workflow consistently, especially to read-only audits, high-risk migrations, and partial user-workflow acceptance."
  - "Whether any session-derived pattern predicts user value, product success, recommendation quality, or production reliability."
  - "The full content of raw sessions, worker events, private reasoning, and any unprepared holdout dossiers; these were outside the permitted read boundary."
  - "Whether the count of two explicit-hypothesis dossiers would change under a different dossier schema or coding rule."
  - "Whether durable record updates were complete and source-of-truth-correct in every session; dossier 03 ended before a final close."
