id: session-pattern-extraction

repeat:
  from: backtest
  until: {ref: adjust.decision.accepted}

steps:
  identify:
    inputs:
      sessions: {doc: Readable historical sessions with stable source references.}
      target: {doc: Recurring behavior to extract.}
      constraints: {doc: "Optional safety, privacy, and scope constraints."}
    procedure:
      - Select relevant independent sessions and freeze development, tuning, and holdout splits before interpretation.
    outputs:
      inventory:
        doc: Target, constraints, selected sessions, source references, independence groups, and fixed splits.
        acceptance:
          - Every selected session has a source reference, independence group, and split.

  extract:
    inputs:
      inventory: {ref: identify.inventory}
    procedure:
      - Extract recurring triggers, actions, decisions, handoffs, outcomes, interventions, and exceptions from development sessions.
    outputs:
      patterns:
        doc: Supported, contradicted, uncertain, and rejected patterns with evidence references.
        acceptance:
          - Every proposed pattern states its evidence, scope, contradictions, and uncertainty.

  define:
    inputs:
      patterns: {ref: extract.patterns}
    procedure:
      - Encode supported patterns as a candidate train and define the comparison baseline.
    outputs:
      candidate:
        doc: Declarative candidate train.
        acceptance:
          - Every step has inputs, procedure, and outputs with acceptance checks.
      baseline:
        doc: Fixed comparison behavior.
        acceptance:
          - The baseline and comparison assumptions are explicit.

  backtest:
    inputs:
      candidate: {ref: define.candidate}
      baseline: {ref: define.baseline}
      tuning: {ref: identify.inventory.tuning}
    procedure:
      - Evaluate candidate and baseline on the same unseen tuning cases and preserve failures and unknowns.
    outputs:
      report:
        doc: Comparable per-case and aggregate results.
        acceptance:
          - Every case contains candidate and baseline results without using holdout evidence.

  adjust:
    inputs:
      candidate: {ref: define.candidate}
      report: {ref: backtest.report}
      patterns: {ref: extract.patterns}
    procedure:
      - Classify material misses and make only the smallest repeatedly supported change.
    outputs:
      candidate:
        doc: Adjusted or unchanged candidate.
        acceptance:
          - Every change names its evidence, expected effect, and regressions.
      decision:
        doc: Repeat or freeze decision.
        acceptance:
          - Repeat is chosen only for an evidence-backed adjustment.

  converge:
    inputs:
      candidate: {ref: adjust.candidate}
      holdout: {ref: identify.inventory.holdout}
    procedure:
      - Freeze the converged candidate and evaluate it once on holdout.
    outputs:
      candidate:
        doc: Current candidate, frozen only after convergence.
        acceptance:
          - A frozen candidate has completed its holdout evaluation.
      report:
        doc: Iteration history and convergence result.
        acceptance:
          - The report preserves failures and makes no unsupported convergence claim.
