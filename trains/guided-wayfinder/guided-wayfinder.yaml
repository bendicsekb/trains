id: guided-wayfinder

steps:
  discover:
    inputs:
      goal: {doc: The outcome we are trying to reach.}
    procedure:
      - Use the goal, current working tree, and any references in the goal to discover the relevant system and establish its current state.
      - Identify scope, evidence, unknowns, blockers, constraints, and the first decision frontier; ask the human only for judgement that cannot be discovered from available evidence.
      - Keep the map low-resolution; the human supplies judgement, not system documentation.
    outputs:
      mission:
        doc: "A bounded destination and initial map containing the current system, evidence, known territory, fog of war, blockers, constraints, and first decision frontier."
        acceptance:
          - The scope, evidence, unknowns, blockers, and first frontier are explicit.

  wayfind:
    inputs:
      mission: {ref: discover.mission}
    procedure:
      ref: ./guided-wayfinder-cycle.yaml
    repeat:
      inputs:
        previous: {ref: result}
      until: {ref: result.stop}
    outputs:
      result: {ref: explore_next.result}
