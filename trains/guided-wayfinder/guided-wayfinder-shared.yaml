id: guided-wayfinder-shared
session: shared

steps:
  discover:
    inputs:
      goal: {doc: The outcome we are trying to reach.}
    procedure:
      - Inspect the goal, working tree, and its references to map scope, evidence, constraints, blockers, and the next frontier.
      - Label material claims as known knowns (verified), known unknowns (specific open questions or assumptions), or unknown unknowns (relevant territory not yet checked).
      - For each blocker, state the simple, system-supported solution an experienced engineer would try first and its smallest useful check.
      - Treat the goal as authorization for in-scope work. Do reversible work and local checks autonomously, including narrow infrastructure changes with a clear rollback. Ask only about consequential choices the goal does not settle.
      - Keep the map low-resolution; ask for judgement, not system documentation.
    outputs:
      mission:
        doc: "A bounded destination and initial map containing the current system, evidence, known territory, fog of war, blockers, constraints, and first decision frontier."
        acceptance:
          - The scope, evidence, unknowns, blockers, and first frontier are explicit.
          - Each blocker has a natural path and a check; any workaround is evidence-based.
          - Routine reversible work is not turned into an approval question.

  wayfind:
    inputs:
      mission: {ref: discover.mission}
    procedure:
      ref: ./guided-wayfinder-cycle.yaml
    repeat:
      inputs:
        previous: {ref: result}
      until: {ref: result.stop}
    outputs:
      result: {ref: explore_next.result}
